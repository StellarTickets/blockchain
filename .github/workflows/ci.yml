name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings -W clippy::pedantic

      - name: Test
        run: cargo test --workspace

      - name: Proptest
        env:
          PROPTEST_CASES: 64
        run: cargo test --workspace prop

  build-wasm:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Stellar CLI
        uses: stellar/stellar-cli@v27.1.0

      - name: Build optimized WASM
        run: stellar contract build

      - name: Check WASM size
        env:
          WASM_MAX_BYTES: 524288
        run: |
          wasm_path="target/wasm32v1-none/release/stellar_tickets_ticketing.wasm"
          wasm_size=$(stat -c%s "$wasm_path")
          echo "WASM size: ${wasm_size} bytes (limit: ${WASM_MAX_BYTES} bytes)"
          test "$wasm_size" -le "$WASM_MAX_BYTES"

  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check advisories and licenses
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
