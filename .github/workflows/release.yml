name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-wasm:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Stellar CLI
        uses: stellar/stellar-cli@v27.1.0

      - name: Build contract
        run: stellar contract build
      - name: Generate checksum
        run: |
          sha256sum target/wasm32v1-none/release/stellar_tickets_ticketing.wasm \
            > target/wasm32v1-none/release/stellar_tickets_ticketing.wasm.sha256
          cat target/wasm32v1-none/release/stellar_tickets_ticketing.wasm.sha256
      # The contract spec lets integrators generate bindings and decode
      # events without building the wasm themselves (issue #60).
      - name: Export contract spec
        run: scripts/export-spec.sh target/wasm32v1-none/release
      - name: Upload wasm artifact
        uses: actions/upload-artifact@v4
        with:
          name: ticketing-wasm
          path: |
            target/wasm32v1-none/release/stellar_tickets_ticketing.wasm
            target/wasm32v1-none/release/stellar_tickets_ticketing.wasm.sha256
            target/wasm32v1-none/release/stellar_tickets_ticketing.spec.json
            target/wasm32v1-none/release/stellar_tickets_ticketing.spec.xdr
      - name: Upload release assets
        uses: softprops/action-gh-release@v3
        with:
          files: |
            target/wasm32v1-none/release/stellar_tickets_ticketing.wasm
            target/wasm32v1-none/release/stellar_tickets_ticketing.wasm.sha256
            target/wasm32v1-none/release/stellar_tickets_ticketing.spec.json
            target/wasm32v1-none/release/stellar_tickets_ticketing.spec.xdr
