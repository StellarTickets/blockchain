name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-wasm:
    runs-on: ubuntu-latest
    outputs:
      wasm_path: ${{ steps.set-outputs.outputs.wasm_path }}
      wasm_hash: ${{ steps.set-outputs.outputs.wasm_hash }}
      wasm_size: ${{ steps.set-outputs.outputs.wasm_size }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Stellar CLI
        uses: stellar/stellar-cli@v28.0.0

      - name: Build contract
        run: stellar contract build

      - name: Optimize WASM
        run: |
          WASM="target/wasm32v1-none/release/stellar_tickets_ticketing.wasm"
          if [ ! -f "$WASM" ]; then
            WASM="target/wasm32-unknown-unknown/release/stellar_tickets_ticketing.wasm"
          fi
          if [ ! -f "$WASM" ]; then
            echo "Error: Built WASM file not found at '$WASM'" >&2
            exit 1
          fi
          echo "==> Optimizing contract WASM..."
          stellar contract optimize --wasm "$WASM"
          OPT_WASM="${WASM%.wasm}.optimized.wasm"
          if [ -f "$OPT_WASM" ]; then
            FINAL_WASM="$OPT_WASM"
          else
            FINAL_WASM="$WASM"
          fi
          WASM_HASH=$(sha256sum "$FINAL_WASM" | awk '{print $1}')
          WASM_SIZE=$(stat -c%s "$FINAL_WASM")
          echo "wasm_path=$FINAL_WASM" >> $GITHUB_OUTPUT
          echo "wasm_hash=$WASM_HASH" >> $GITHUB_OUTPUT
          echo "wasm_size=$WASM_SIZE" >> $GITHUB_OUTPUT
          echo "=================================================="
          echo "Contract build & optimization successful!"
          echo "WASM File: $FINAL_WASM"
          echo "WASM Hash: $WASM_HASH"
          echo "WASM Size: $WASM_SIZE bytes"
          echo "=================================================="
        id: set-outputs

      - name: Upload wasm artifact
        uses: actions/upload-artifact@v4
        with:
          name: ticketing-wasm
          path: ${{ steps.set-outputs.outputs.wasm_path }}
          retention-days: 90

      - name: Upload wasm hash
        uses: actions/upload-artifact@v4
        with:
          name: ticketing-wasm-hash
          path: |
            ${{ steps.set-outputs.outputs.wasm_path }}
        if: always()

  create-release:
    runs-on: ubuntu-latest
    needs: build-wasm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download WASM artifact
        uses: actions/download-artifact@v4
        with:
          name: ticketing-wasm
          path: ./artifacts

      - name: Prepare release assets
        run: |
          WASM_FILE=$(find ./artifacts -name "*.wasm" | head -1)
          WASM_HASH=$(sha256sum "$WASM_FILE" | awk '{print $1}')
          WASM_SIZE=$(stat -c%s "$WASM_FILE")
          echo "WASM_FILE=$WASM_FILE" >> $GITHUB_ENV
          echo "WASM_HASH=$WASM_HASH" >> $GITHUB_ENV
          echo "WASM_SIZE=$WASM_SIZE" >> $GITHUB_ENV

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.WASM_FILE }}
          body: |
            ## Stellar Tickets Ticketing Contract Release

            ### Contract Artifacts
            - **WASM File**: `stellar_tickets_ticketing.wasm`
            - **SHA256 Hash**: `${{ env.WASM_HASH }}`
            - **Size**: ${{ env.WASM_SIZE }} bytes

            ### Verification
            Verify the WASM hash:
            ```bash
            sha256sum stellar_tickets_ticketing.wasm
            # Should output: ${{ env.WASM_HASH }}  stellar_tickets_ticketing.wasm
            ```

            ### Deployment
            Deploy using stellar CLI:
            ```bash
            stellar contract deploy \
              --wasm stellar_tickets_ticketing.wasm \
              --source-account <ACCOUNT> \
              --network <NETWORK>
            ```
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
